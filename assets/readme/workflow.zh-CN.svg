<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" fill="none" role="img" aria-labelledby="title desc"><title id="title">从需求出发，沿着词条核对</title><desc id="desc">从左到右：按用途查找项目，阅读词条，核对 AI 任务用途、活动与 Star 证据，再前往上游项目。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1A2C"/><stop offset="1" stop-color="#0A242C"/></linearGradient></defs><rect x="1" y="1" width="1198" height="266" rx="26" fill="url(#bg)" stroke="#254253" stroke-width="2"/><text x="48" y="52" fill="#E7F2F6" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" >从需求出发，沿着词条核对</text><rect x="48" y="83" width="240" height="147" rx="17" fill="#102C3D" stroke="#2C4D5E"/><rect x="68" y="100" width="34" height="25" rx="8" fill="#23544F"/><text x="85" y="118" fill="#8BF1D8" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="68" y="156" fill="#E8F5F6" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" >按用途查找</text><text x="68" y="185" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >从需求进入分类</text><text x="68" y="208" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >确定要解决的问题</text><path d="M299 157H324M318 151L324 157L318 163" stroke="#67D8C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="83" width="240" height="147" rx="17" fill="#102C3D" stroke="#2C4D5E"/><rect x="356" y="100" width="34" height="25" rx="8" fill="#23544F"/><text x="373" y="118" fill="#8BF1D8" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="356" y="156" fill="#E8F5F6" font-family