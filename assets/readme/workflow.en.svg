<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" fill="none" role="img" aria-labelledby="title desc"><title id="title">A practical path from a need to a tool</title><desc id="desc">Read left to right: choose a use case, read the project entry, check AI task use, activity and Star evidence, then visit the upstream repository.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1A2C"/><stop offset="1" stop-color="#0A242C"/></linearGradient></defs><rect x="1" y="1" width="1198" height="266" rx="26" fill="url(#bg)" stroke="#254253" stroke-width="2"/><text x="48" y="52" fill="#E7F2F6" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" >A practical path from a need to a tool</text><rect x="48" y="83" width="240" height="147" rx="17" fill="#102C3D" stroke="#2C4D5E"/><rect x="68" y="100" width="34" height="25" rx="8" fill="#23544F"/><text x="85" y="118" fill="#8BF1D8" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="68" y="156" fill="#E8F5F6" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" >Start with a need</text><text x="68" y="185" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >Choose a use case</text><text x="68" y="208" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >Find a relevant category</text><path d="M299 157H324M318 151L324 157L318 163" stroke="#67D8C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="83" width="240" height="147" rx="17" fill="#102C3D" stroke="#2C4D5E"/><rect x="356" y="100" width="34" height="25" rx="8" fill="#23544F"/><text x="373" y="118" fill="#8BF1D8" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="356" y="156" fill="#E8F5F6" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" >Read the entry</text><text x="356" y="185" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >Features, setup and limits</text><text x="356" y="208" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >Installation and usage links</text><path d="M587 157H612M606 151L612 157L606 163" stroke="#67D8C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="624" y="83" width="240" height="147" rx="17" fill="#102C3D" stroke="#2C4D5E"/><rect x="644" y="100" width="34" height="25" rx="8" fill="#23544F"/><text x="661" y="118" fill="#8BF1D8" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text><text x="644" y="156" fill="#E8F5F6" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" >Check the criteria</text><text x="644" y="185" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >AI use, activity and Stars</text><text x="644" y="208" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >Check sources and dates</text><path d="M875 157H900M894 151L900 157L894 163" stroke="#67D8C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="912" y="83" width="240" height="147" rx="17" fill="#102C3D" stroke="#2C4D5E"/><rect x="932" y="100" width="34" height="25" rx="8" fill="#23544F"/><text x="949" y="118" fill="#8BF1D8" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" text-anchor="middle">04</text><text x="932" y="156" fill="#E8F5F6" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" >Visit upstream</text><text x="932" y="185" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >Read the current docs</text><text x="932" y="208" fill="#A4C2CD" font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" >Then install or try the tool</text></svg>